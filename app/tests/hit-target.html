<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>AetherTune Overlay 測試底板</title><style>body{margin:0;background:#bb4150;color:white;font:24px system-ui}button{position:fixed;inset:0;width:100%;height:100%;background:linear-gradient(135deg,#9b3344,#365598);color:white;border:0;font:inherit}output{pointer-events:none;position:fixed;top:12px;left:12px;background:#081d34;padding:15px;z-index:2}</style><button id="target">底板：只有實際收到點擊才累加。<br>Overlay 已開啟 Click-through 時應收到滑鼠；關閉時應被 Overlay 擋住。</button><output aria-live="polite">Clicks: <b id="count">0</b></output><script>let clicks=0;document.querySelector('#target').onclick=()=>{document.querySelector('#count').textContent=String(++clicks);};</script></html>
